spring:
  application:
    name: lias-lab-manager
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lias_lab}
    username: ${DB_USER:lias}
    password: ${DB_PASSWORD:lias}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}
server:
  port: ${SERVER_PORT:8080}
app:
  jwt:
    secret: ${JWT_SECRET:}
    access-minutes: 15
    refresh-days: 7
  upload-dir: ${UPLOAD_DIR:uploads}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost}
  mail-enabled: ${MAIL_ENABLED:false}
  public-url: ${PUBLIC_URL:http://localhost:5173}
  seed:
    initial-password: ${INITIAL_ADMIN_PASSWORD:}
