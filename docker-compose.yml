services:
  postgres:
    image: postgres:16-alpine
    container_name: lias-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lias_lab}
      POSTGRES_USER: ${POSTGRES_USER:-lias}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_postgres_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lias} -d ${POSTGRES_DB:-lias_lab}"]
      interval: 10s
      timeout: 5s
      retries: 8

  backend:
    build: ./backend
    container_name: lias-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-lias_lab}
      DB_USER: ${POSTGRES_USER:-lias}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change_me_postgres_password}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env before deployment}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?Set INITIAL_ADMIN_PASSWORD in .env before deployment}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:5173}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost}
      UPLOAD_DIR: /app/uploads
    expose:
      - "8080"
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    container_name: lias-frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"

volumes:
  postgres_data:
  uploads_data:
